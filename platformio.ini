; =============================================================================
;  camara_redes  -  PlatformIO
;
;  El proyecto conserva el layout de sketch de Arduino (todo en la raiz), asi que
;  la MISMA carpeta se abre igual en el Arduino IDE y en PlatformIO. Por eso
;  src_dir = . en vez de mover archivos a src/.
;
;  Un environment por modo. En PlatformIO NO hace falta editar config.h: el modo
;  se fuerza con -D STREAM_MODE=n (config.h tiene un #ifndef alrededor del
;  #define justamente para esto). En el Arduino IDE sigue mandando config.h.
; =============================================================================

[platformio]
src_dir      = .
default_envs = modo1_http_mjpeg


[common]
; Archivos comunes a los tres modos. Cada env agrega SOLO su mode_*.cpp: asi el
; Library Dependency Finder no ve los #include de los otros modos y no exige
; tener instaladas sus librerias.
; OJO con el .ino: PlatformIO NO compila el .ino directamente. Antes de armar la
; lista de fuentes lo convierte en "<nombre>.ino.cpp", lo deja AL LADO del .ino
; (no en .pio/) y lo borra al terminar. O sea que el filtro tiene que pedir
; *.ino.cpp, no *.ino: con *.ino no entra nada y el link falla con
; "undefined reference to setup()".
src_base =
    +<*.ino.cpp>
    +<camera.cpp>
    +<metrics.cpp>
    +<net.cpp>


[env]
; La plataforma OFICIAL platformio/espressif32 (7.1.0) todavia trae el core
; arduino-esp32 2.0.17. Este proyecto necesita 3.x: usa WiFiServer::accept(),
; NetworkClient y setConnectionTimeout(), que en 2.x no existen.
; Esta es la build de pioarduino con el core 3.3.11 exacto.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = seeed_xiao_esp32s3
framework = arduino

; El board ya define -DBOARD_HAS_PSRAM y memory_type = qio_opi, o sea que la
; PSRAM OPI viene HABILITADA sola. Es la diferencia con el Arduino IDE, donde
; hay que prenderla a mano en Herramientas -> PSRAM.
;
; Particiones: el default para 8 MB deja ~1,3 MB de app. El sketch usa ~1 MB, o
; sea que entraria justo. Se usa el mismo esquema que en el IDE (3 MB de app)
; para tener margen y para que los dos entornos produzcan lo mismo.
board_build.partitions = default_8MB.csv

monitor_speed = 115200
; Sin upload_port/monitor_port: PlatformIO autodetecta la placa por VID:PID de
; Espressif (303A:1001), y con USB CDC nativo el puerto puede reenumerar con
; otro numero al resetear, asi que fijarlo es peor.
; NO poner un glob tipo /dev/cu.usbmodem*: PlatformIO se lo pasa literal a
; esptool y falla con "could not open port". Si hay varias placas conectadas,
; poner el puerto exacto que muestre "pio device list".

; Decodifica los backtraces de un panic a numero de linea. No toca las filas del
; CSV. Aun asi, para GRABAR una corrida conviene un terminal crudo (ver README).
monitor_filters = esp32_exception_decoder

; CORE_DEBUG_LEVEL=0 equivale a "Core Debug Level: None" en el IDE: los logs del
; core ensuciarian el CSV.
build_flags = -DCORE_DEBUG_LEVEL=0


; -----------------------------------------------------------------------------
; MODO 1  -  HTTP MJPEG   (el equipo es servidor: escucha en 80 y 81)
; -----------------------------------------------------------------------------
[env:modo1_http_mjpeg]
build_flags      = ${env.build_flags} -DSTREAM_MODE=1
build_src_filter = ${common.src_base} +<mode_http_mjpeg.cpp>
; sin lib_deps: el modo 1 usa solo el core


; -----------------------------------------------------------------------------
; MODO 2  -  WebSocket    (el equipo es servidor: escucha en 80)
; -----------------------------------------------------------------------------
[env:modo2_websocket]
build_flags      = ${env.build_flags} -DSTREAM_MODE=2
build_src_filter = ${common.src_base} +<mode_websocket.cpp>
lib_deps =
    esp32async/ESPAsyncWebServer @ 3.12.0
    esp32async/AsyncTCP @ 3.5.0


; -----------------------------------------------------------------------------
; MODO 3  -  MQTT         (el equipo es cliente: no escucha ningun puerto)
; -----------------------------------------------------------------------------
[env:modo3_mqtt]
build_flags      = ${env.build_flags} -DSTREAM_MODE=3
build_src_filter = ${common.src_base} +<mode_mqtt.cpp>
lib_deps =
    knolleary/PubSubClient @ 2.8
