# -----------------------------------------------------------------------------
# Mosquitto para la maqueta de medicion. NO usar fuera del laboratorio.
#
# Mosquitto 2.x cambio dos defaults que rompen esto si no se tocan:
#   - solo escucha en 127.0.0.1  -> el ESP32 no lo alcanza
#   - allow_anonymous false      -> rechaza la conexion sin usuario
# Los dos se corrigen abajo, a proposito y para esta etapa nada mas.
# -----------------------------------------------------------------------------

# Escuchar en todas las interfaces, en claro. Sin TLS: la captura tiene que
# poder leerse. El gancho para 8883 esta comentado al final.
listener 1883 0.0.0.0

# Sin autenticacion en esta etapa, por la misma razon.
allow_anonymous true

# Un JPEG VGA anda por los 20-50 KB. El default de Mosquitto ya lo permite, pero
# queda explicito para que no sorprenda si se sube el framesize.
message_size_limit 262144

# Log a consola: sirve para ver CONNECT/SUBSCRIBE/PUBLISH desde el lado broker y
# contrastarlos con la captura.
log_dest stdout
log_type all
connection_messages true

persistence false

# --- Etapa siguiente (TLS), NO habilitar todavia ---
# listener 8883 0.0.0.0
# cafile   /ruta/ca.crt
# certfile /ruta/server.crt
# keyfile  /ruta/server.key
# require_certificate false
